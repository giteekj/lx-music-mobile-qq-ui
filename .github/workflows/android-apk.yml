name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [beta, main, master]

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_STORE_FILE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
        run: |
          test -n "$KEYSTORE_STORE_FILE_BASE64"
          printf '%s' "$KEYSTORE_STORE_FILE_BASE64" | base64 --decode > app/lx-music-mobile-release.jks

      - name: Build release APKs
        working-directory: android
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE='lx-music-mobile-release.jks' \
            -PMYAPP_UPLOAD_KEY_ALIAS="$KEYSTORE_KEY_ALIAS" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$KEYSTORE_PASSWORD"

      - name: Remove temporary signing file
        if: always()
        working-directory: android
        run: rm -f app/lx-music-mobile-release.jks

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-mobile-release-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
